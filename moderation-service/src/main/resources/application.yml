spring:
  application:
    name: moderation-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fanzone_moderation
    username: fanzone
    password: fanzone
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8087

fanzone:
  jwt:
    secret: ${JWT_SECRET:fanzone-dev-jwt-secret-key-change-in-production-min-32-chars}
    access-token-expiry: PT1H
    refresh-token-expiry: P7D
  openai:
    api-key: ${OPENAI_API_KEY:}
    moderation-url: https://api.openai.com/v1/moderations
