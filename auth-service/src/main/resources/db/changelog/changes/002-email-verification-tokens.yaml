databaseChangeLog:
  - changeSet:
      id: 002-create-email-verification-tokens
      author: fanzone
      changes:
        - createTable:
            tableName: email_verification_tokens
            columns:
              - column:
                  name: id
                  type: uuid
                  defaultValueComputed: gen_random_uuid()
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: user_id
                  type: uuid
                  constraints:
                    nullable: false
                    foreignKeyName: fk_verification_token_user
                    references: users(id)
              - column:
                  name: token
                  type: varchar(255)
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_verification_token
              - column:
                  name: expires_at
                  type: timestamp with time zone
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: timestamp with time zone
                  defaultValueComputed: now()
        - createIndex:
            tableName: email_verification_tokens
            indexName: idx_verification_tokens_user_id
            columns:
              - column:
                  name: user_id
        - createIndex:
            tableName: email_verification_tokens
            indexName: idx_verification_tokens_token
            columns:
              - column:
                  name: token
