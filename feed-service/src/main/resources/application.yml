spring:
  application:
    name: feed-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fanzone_feed
    username: fanzone
    password: fanzone
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: feed-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: com.fanzone.common.events
  data:
    redis:
      host: localhost
      port: 6379
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: 2000

server:
  port: 8082

fanzone:
  jwt:
    secret: ${JWT_SECRET:fanzone-dev-jwt-secret-key-change-in-production-min-32-chars}
    access-token-expiry: PT1H
    refresh-token-expiry: P7D
