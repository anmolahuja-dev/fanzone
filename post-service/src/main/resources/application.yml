spring:
  application:
    name: post-service
  datasource:
    url: jdbc:postgresql://localhost:5432/fanzone_post
    username: fanzone
    password: fanzone
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  kafka:
    bootstrap-servers: localhost:9092
  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8083

fanzone:
  jwt:
    secret: ${JWT_SECRET:fanzone-dev-jwt-secret-key-change-in-production-min-32-chars}
    access-token-expiry: PT1H
    refresh-token-expiry: P7D

spring.servlet.multipart:
  max-file-size: 10MB
  max-request-size: 12MB
