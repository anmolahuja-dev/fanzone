version: "3.9"

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  postgres:
    image: postgres:16
    container_name: fanzone-postgres
    environment:
      POSTGRES_USER: fanzone
      POSTGRES_PASSWORD: fanzone_secret
      POSTGRES_DB: fanzone
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fanzone"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fanzone-net

  redis:
    image: redis:7
    container_name: fanzone-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - fanzone-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: fanzone-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    volumes:
      - zookeeper_data:/var/lib/zookeeper/data
      - zookeeper_log:/var/lib/zookeeper/log
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - fanzone-net

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: fanzone-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"
      - "29092:29092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - fanzone-net

  # ============================================
  # Application Services
  # ============================================

  auth-service:
    build:
      context: .
      dockerfile: auth-service/Dockerfile
    container_name: fanzone-auth-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fanzone_auth
      SPRING_DATASOURCE_USERNAME: fanzone
      SPRING_DATASOURCE_PASSWORD: fanzone_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8081:8081"
    networks:
      - fanzone-net

  feed-service:
    build:
      context: .
      dockerfile: feed-service/Dockerfile
    container_name: fanzone-feed-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fanzone_feed
      SPRING_DATASOURCE_USERNAME: fanzone
      SPRING_DATASOURCE_PASSWORD: fanzone_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8082:8082"
    networks:
      - fanzone-net

  post-service:
    build:
      context: .
      dockerfile: post-service/Dockerfile
    container_name: fanzone-post-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fanzone_post
      SPRING_DATASOURCE_USERNAME: fanzone
      SPRING_DATASOURCE_PASSWORD: fanzone_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8083:8083"
    networks:
      - fanzone-net

  match-thread-service:
    build:
      context: .
      dockerfile: match-thread-service/Dockerfile
    container_name: fanzone-match-thread-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fanzone_match_thread
      SPRING_DATASOURCE_USERNAME: fanzone
      SPRING_DATASOURCE_PASSWORD: fanzone_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8084:8084"
    networks:
      - fanzone-net

  reputation-service:
    build:
      context: .
      dockerfile: reputation-service/Dockerfile
    container_name: fanzone-reputation-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fanzone_reputation
      SPRING_DATASOURCE_USERNAME: fanzone
      SPRING_DATASOURCE_PASSWORD: fanzone_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8085:8085"
    networks:
      - fanzone-net

  notification-service:
    build:
      context: .
      dockerfile: notification-service/Dockerfile
    container_name: fanzone-notification-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fanzone_notification
      SPRING_DATASOURCE_USERNAME: fanzone
      SPRING_DATASOURCE_PASSWORD: fanzone_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8086:8086"
    networks:
      - fanzone-net

  moderation-service:
    build:
      context: .
      dockerfile: moderation-service/Dockerfile
    container_name: fanzone-moderation-service
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fanzone_moderation
      SPRING_DATASOURCE_USERNAME: fanzone
      SPRING_DATASOURCE_PASSWORD: fanzone_secret
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "8087:8087"
    networks:
      - fanzone-net

volumes:
  postgres_data:
  redis_data:
  zookeeper_data:
  zookeeper_log:
  kafka_data:

networks:
  fanzone-net:
    driver: bridge
